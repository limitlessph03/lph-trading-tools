<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Limitless PH Trading Tool...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: linear-gradient(145deg, #071426, #050d1a);
      border: 1px solid rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.15);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(34, 211, 238, 0.2);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 22px; margin: 0 0 10px; color: #fff; }
    p { font-size: 14px; color: #94a3b8; margin: 0 0 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #f5c542, #ffd86b);
      color: #0d0a04;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(245, 197, 66, 0.3);
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Your download is starting...</h2>
    <p>Please wait a moment while we fetch your official Limitless PH trading tool bundle.</p>
    <a id="manualLink" href="#" class="btn">Click here if download doesn't start</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var fileUrl = params.get('url') || 'https://github.com/limitlessph03/lph-trading-tools/releases/download/v1.0.0/MT4_LPH_Institutional_Indicators_and_EAs.zip';
      
      var manualLink = document.getElementById('manualLink');
      if (manualLink) manualLink.href = fileUrl;

      // Trigger download in top window
      setTimeout(function () {
        window.location.href = fileUrl;
      }, 500);
    })();
  </script>
</body>
</html>
